services:
    app:
        image: 'ghcr.io/tadeasditte/rozhanitsy:${ROZHANITSY_TAG:-latest}'
        restart: unless-stopped
        env_file: .env
        environment:
            RUN_MIGRATIONS: 'true'
        ports:
            - '${APP_PORT:-3000}:80'
        volumes:
            - 'storage:/app/storage/app'
            - 'caddy-data:/data/caddy'
            - 'caddy-config:/config/caddy'
        depends_on:
            db:
                condition: service_healthy
            valkey:
                condition: service_healthy

    scheduler:
        image: 'ghcr.io/tadeasditte/rozhanitsy:${ROZHANITSY_TAG:-latest}'
        restart: unless-stopped
        env_file: .env
        command: ['php', 'artisan', 'schedule:work']
        volumes:
            - 'storage:/app/storage/app'
        healthcheck:
            disable: true
        depends_on:
            app:
                condition: service_healthy

    db:
        image: 'postgres:18-alpine'
        restart: unless-stopped
        environment:
            POSTGRES_DB: '${DB_DATABASE:-rozhanitsy}'
            POSTGRES_USER: '${DB_USERNAME:-rozhanitsy}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:?DB_PASSWORD must be set in .env}'
        volumes:
            - 'db:/var/lib/postgresql'
        healthcheck:
            test: ['CMD-SHELL', 'pg_ -U "$$POSTGRES_USER"']
            interval: 5s
            timeout: 5s
            retries: 10

    valkey:
        image: 'valkey/valkey:8-alpine'
        restart: unless-stopped
        volumes:
            - 'valkey:/data'
        healthcheck:
            test: ['CMD', 'valkey-cli', 'ping']
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    db:
    valkey:
    storage:
    caddy-data:
    caddy-config: