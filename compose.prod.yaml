name: rozhanitsy

services:
    app:
        image: 'ghcr.io/tadeasditte/rozhanitsy:${ROZHANITSY_TAG:-latest}'
        restart: unless-stopped
        env_file: .env.production
        environment:
            RUN_MIGRATIONS: 'true'
        ports:
            - '${APP_PORT:-80}:80'
            - '${APP_HTTPS_PORT:-443}:443'
            - '${APP_HTTPS_PORT:-443}:443/udp'
        volumes:
            - 'storage:/app/storage/app'
            - 'caddy-data:/data/caddy'
            - 'caddy-config:/config/caddy'
        depends_on:
            db:
                condition: service_healthy
            valkey:
                condition: service_healthy

    scheduler:
        image: 'ghcr.io/tadeasditte/rozhanitsy:${ROZHANITSY_TAG:-latest}'
        restart: unless-stopped
        env_file: .env.production
        command: ['php', 'artisan', 'schedule:work']
        volumes:
            - 'storage:/app/storage/app'
        healthcheck:
            disable: true
        depends_on:
            app:
                condition: service_healthy

    db:
        image: 'postgres:18-alpine'
        restart: unless-stopped
        environment:
            POSTGRES_DB: '${DB_DATABASE:?DB_DATABASE must be set}'
            POSTGRES_USER: '${DB_USERNAME:?DB_USERNAME must be set}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:?DB_PASSWORD must be set}'
        volumes:
            - 'db:/var/lib/postgresql'
        healthcheck:
            test: ['CMD', 'pg_isready', '-q', '-d', '${DB_DATABASE}', '-U', '${DB_USERNAME}']
            interval: 5s
            timeout: 5s
            retries: 10

    valkey:
        image: 'valkey/valkey:8-alpine'
        restart: unless-stopped
        volumes:
            - 'valkey:/data'
        healthcheck:
            test: ['CMD', 'valkey-cli', 'ping']
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    db:
    valkey:
    storage:
    caddy-data:
    caddy-config:
